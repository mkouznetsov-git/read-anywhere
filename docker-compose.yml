name: readarc
services:
  relay:
    build:
      context: ./server/rendezvous_relay
    image: readarc-relay:dev
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      PORT: "8787"
      READARC_RELAY_DATA_DIR: "/data"
      READARC_OFFLINE_QUEUE_TTL_SECONDS: "2592000"
    volumes:
      - ${READARC_RELAY_HOST_DATA_DIR:-./server_data/relay}:/data
    restart: unless-stopped
