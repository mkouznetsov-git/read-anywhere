name: Build installable packages

on:
  workflow_dispatch:
    inputs:
      default_relay_url:
        description: 'Optional default relay URL compiled into the app. Default is https://relay.readarc.ru'
        required: false
        default: ''
      build_debug_artifacts:
        description: 'Also build debug artifacts. Release artifacts are always built.'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      publish_release:
        description: 'Publish GitHub Release from this run'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      release_tag:
        description: 'Release tag for manual publishing, e.g. v0.1.2-test. Empty means main-latest.'
        required: false
        default: ''
      release_prerelease:
        description: 'Mark manual release as prerelease'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      cleanup_legacy_releases:
        description: 'Delete legacy Read Anywhere releases/assets when publishing'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

env:
  # Set repository variable READARC_DEFAULT_RELAY_URL after choosing a relay,
  # or pass default_relay_url when manually running this workflow.
  READARC_DEFAULT_RELAY_URL: ${{ github.event.inputs.default_relay_url || vars.READARC_DEFAULT_RELAY_URL || vars.READANYWHERE_DEFAULT_RELAY_URL || 'https://relay.readarc.ru' }}
  READANYWHERE_DEFAULT_RELAY_URL: ${{ github.event.inputs.default_relay_url || vars.READARC_DEFAULT_RELAY_URL || vars.READANYWHERE_DEFAULT_RELAY_URL || 'https://relay.readarc.ru' }}
  READARC_BASE_VERSION: '0.1.0'
  READARC_BUILD_NUMBER: ${{ github.run_number }}
  BUILD_DEBUG_ARTIFACTS: ${{ github.event.inputs.build_debug_artifacts || 'false' }}

jobs:
  tests:
    name: Flutter and relay tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Run tests
        run: ./scripts/run_tests.sh

  android-release:
    name: Android release APKs and AAB
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build Android release artifacts
        run: ./scripts/package_android.sh

      - name: Upload Android release artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ReadArc-android-release
          path: dist/android/*
          retention-days: 7

  macos-release:
    name: macOS release DMG and PKG
    runs-on: macos-latest
    needs: tests
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build macOS release artifacts
        run: ./scripts/package_macos.sh

      - name: Upload macOS release packages
        uses: actions/upload-artifact@v6
        with:
          name: ReadArc-macos-release-dmg-pkg
          path: dist/macos/*
          retention-days: 7

  github-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - android-release
      - macos-release
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_release == 'true')
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download Android release artifacts
        uses: actions/download-artifact@v6
        with:
          name: ReadArc-android-release
          path: release-assets/android

      - name: Download macOS release artifacts
        uses: actions/download-artifact@v6
        with:
          name: ReadArc-macos-release-dmg-pkg
          path: release-assets/macos

      - name: Decide release channel
        id: release_channel
        shell: bash
        run: |
          set -euo pipefail

          TAG=""
          TITLE=""
          PRERELEASE="true"
          ROLLING="false"

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
            TITLE="ReadArc ${TAG}"
            PRERELEASE="false"
            ROLLING="false"
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && -n "${{ github.event.inputs.release_tag }}" ]]; then
            TAG="${{ github.event.inputs.release_tag }}"
            TITLE="ReadArc ${TAG}"
            PRERELEASE="${{ github.event.inputs.release_prerelease }}"
            ROLLING="false"
          else
            TAG="main-latest"
            TITLE="ReadArc main-latest"
            PRERELEASE="true"
            ROLLING="true"
          fi

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "title=${TITLE}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"
          echo "rolling=${ROLLING}" >> "$GITHUB_OUTPUT"

          echo "Release tag: ${TAG}"
          echo "Release title: ${TITLE}"
          echo "Prerelease: ${PRERELEASE}"
          echo "Rolling: ${ROLLING}"

      - name: Prepare release assets and notes
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.release_channel.outputs.tag }}"
          TITLE="${{ steps.release_channel.outputs.title }}"
          PRERELEASE="${{ steps.release_channel.outputs.prerelease }}"
          ROLLING="${{ steps.release_channel.outputs.rolling }}"

          if [[ -f release-assets/android/SHA256SUMS ]]; then
            mv release-assets/android/SHA256SUMS release-assets/android/ReadArc-android-release-SHA256SUMS.txt
          fi
          if [[ -f release-assets/macos/SHA256SUMS ]]; then
            mv release-assets/macos/SHA256SUMS release-assets/macos/ReadArc-macos-release-SHA256SUMS.txt
          fi

          if [[ "$ROLLING" == "true" ]]; then
            CHANNEL_TEXT="Автоматическая rolling-сборка из ветки ${GITHUB_REF_NAME}. Этот релиз обновляется при каждом push в main/master."
          else
            CHANNEL_TEXT="Автоматическая тестовая сборка ReadArc."
          fi

          cat > RELEASE_NOTES.md <<EOF
          # ${TITLE}

          ${CHANNEL_TEXT}

          ## Commit

          - SHA: \`${GITHUB_SHA}\`
          - Snapshot/build number: \`${GITHUB_RUN_NUMBER}\`
          - Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          ## Что внутри

          ### Android

          - universal APK — самый простой вариант для ручной установки с телефона.
          - arm64-v8a APK — меньший файл для большинства современных Android-телефонов.
          - armeabi-v7a APK — для старых Android-устройств.
          - x86_64 APK — в основном для эмуляторов.
          - AAB — Android App Bundle для будущей публикации через Google Play.

          ### macOS

          - DMG — удобная установка перетаскиванием в Applications.
          - PKG — installer package.
          - app.zip — архив приложения для быстрой проверки.

          ## Важно

          Эти сборки предназначены для внутреннего тестирования. macOS-сборки пока не подписаны Developer ID и не notarized. Android release-сборки предназначены для внутреннего тестирования; production-публикация потребует отдельного release signing keystore и настройки iOS/macOS signing/notarization.
          EOF

          echo "Release assets:"
          find release-assets -maxdepth 3 -type f -print | sort

          {
            echo "## GitHub Release assets"
            echo
            echo "Release: \`${TAG}\`"
            echo
            echo "| File | Size |"
            echo "|---|---:|"
            while IFS= read -r file; do
              size="$(du -h "$file" | awk '{print $1}')"
              echo "| $(basename "$file") | $size |"
            done < <(find release-assets -maxdepth 3 -type f -print | sort)
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Move rolling release tag to this commit
        if: steps.release_channel.outputs.rolling == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.release_channel.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "$TAG" "$GITHUB_SHA"
          git push --force origin "refs/tags/${TAG}"

      - name: Remove legacy Read Anywhere releases and assets
        if: github.event.inputs.cleanup_legacy_releases != 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          REPO="${GITHUB_REPOSITORY}"
          TARGET_TAG="${{ steps.release_channel.outputs.tag }}"

          echo "Removing legacy Read Anywhere releases, if any..."
          mapfile -t LEGACY_TAGS < <(gh release list --repo "$REPO" --limit 100 --json tagName,name --jq '.[] | select(((.name // "") | test("Read Anywhere|ReadAnywhere|read_anywhere|read-anywhere"; "i")) or ((.tagName // "") | test("readanywhere|read-anywhere|read_anywhere"; "i"))) | .tagName')
          for legacy_tag in "${LEGACY_TAGS[@]:-}"; do
            [[ -n "$legacy_tag" ]] || continue
            if [[ "$legacy_tag" == "$TARGET_TAG" ]]; then
              continue
            fi
            echo "Deleting legacy release: $legacy_tag"
            gh release delete "$legacy_tag" --repo "$REPO" --cleanup-tag --yes || true
          done

          if gh release view "$TARGET_TAG" --repo "$REPO" >/dev/null 2>&1; then
            if [[ "${{ steps.release_channel.outputs.rolling }}" == "true" ]]; then
              echo "Rolling release: removing all previous assets from target release before uploading the fresh snapshot."
              mapfile -t OLD_ASSETS < <(gh release view "$TARGET_TAG" --repo "$REPO" --json assets --jq '.assets[].name')
              for asset in "${OLD_ASSETS[@]:-}"; do
                [[ -n "$asset" ]] || continue
                echo "Deleting old rolling asset: $asset"
                gh release delete-asset "$TARGET_TAG" "$asset" --repo "$REPO" --yes || true
              done
            else
              echo "Removing legacy assets from target release: $TARGET_TAG"
              mapfile -t LEGACY_ASSETS < <(gh release view "$TARGET_TAG" --repo "$REPO" --json assets --jq '.assets[].name | select(test("Read Anywhere|ReadAnywhere|read_anywhere|read-anywhere"; "i"))')
              for asset in "${LEGACY_ASSETS[@]:-}"; do
                [[ -n "$asset" ]] || continue
                echo "Deleting legacy asset: $asset"
                gh release delete-asset "$TARGET_TAG" "$asset" --repo "$REPO" --yes || true
              done
            fi
          fi

      - name: Publish or update release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="${{ steps.release_channel.outputs.tag }}"
          TITLE="${{ steps.release_channel.outputs.title }}"
          PRERELEASE="${{ steps.release_channel.outputs.prerelease }}"
          REPO="${GITHUB_REPOSITORY}"
          mapfile -t ASSETS < <(find release-assets -maxdepth 3 -type f -print | sort)

          if [[ ${#ASSETS[@]} -eq 0 ]]; then
            echo "No release assets found." >&2
            exit 1
          fi

          CREATE_FLAGS=(--repo "$REPO" --title "$TITLE" --notes-file RELEASE_NOTES.md)
          EDIT_FLAGS=(--repo "$REPO" --title "$TITLE" --notes-file RELEASE_NOTES.md)
          if [[ "$PRERELEASE" == "true" ]]; then
            CREATE_FLAGS+=(--prerelease --latest=false)
            EDIT_FLAGS+=(--prerelease --latest=false)
          else
            CREATE_FLAGS+=(--latest)
            EDIT_FLAGS+=(--latest)
          fi

          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --repo "$REPO" --clobber
            gh release edit "$TAG" "${EDIT_FLAGS[@]}"
          else
            gh release create "$TAG" "${ASSETS[@]}" "${CREATE_FLAGS[@]}"
          fi
