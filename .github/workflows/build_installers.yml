name: Build installable packages

on:
  workflow_dispatch:
    inputs:
      default_relay_url:
        description: 'Optional default relay URL compiled into the app, e.g. https://your-app.koyeb.app'
        required: false
        default: ''
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  # Set repository variable READANYWHERE_DEFAULT_RELAY_URL after deploying relay,
  # or pass default_relay_url when manually running this workflow.
  READANYWHERE_DEFAULT_RELAY_URL: ${{ github.event.inputs.default_relay_url || vars.READANYWHERE_DEFAULT_RELAY_URL || '' }}

jobs:
  tests:
    name: Flutter and relay tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Run tests
        run: ./scripts/run_tests.sh

  android-apk:
    name: Android APK
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build debug APK
        run: ./scripts/package_android.sh

      - name: Upload Android APK
        uses: actions/upload-artifact@v6
        with:
          name: ReadAnywhere-android-apk
          path: dist/android/*.apk

  macos-dmg-pkg:
    name: macOS DMG and PKG
    runs-on: macos-latest
    needs: tests
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build DMG and PKG
        run: ./scripts/package_macos.sh

      - name: Upload macOS packages
        uses: actions/upload-artifact@v6
        with:
          name: ReadAnywhere-macos-dmg-pkg
          path: |
            dist/macos/*.dmg
            dist/macos/*.pkg
            dist/macos/*.zip
