[package]
name = "readarc_djvu_engine"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
# MIT-licensed pure-Rust decoder from the public DjVu v3 specification.
# This avoids GPL DjVuLibre and all external command-line tools.
djvu-rs = "0.9"
