name: readarc
description: Local-first cross-platform reader for ReadArc.
publish_to: 'none'
version: 0.1.0+36

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.3
  cryptography: ^2.7.0
  file_picker: ^8.1.2
  path: ^1.9.0
  path_provider: ^2.1.4
  uuid: ^4.5.1
  web_socket_channel: ^3.0.1
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.2
  pdfx: ^2.9.2
  url_launcher: ^6.3.1
  archive: ^3.6.1
  ffi: ^2.1.3
  image: ^4.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/readarc_icon_128.png
    - assets/brand/readarc_icon_1024.png
